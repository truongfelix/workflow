# What ground-truth.sh looks at. Sourced by bash: plain assignments only.
# FILL: set REPOS (and KEEP_LOCAL) for this project, then how its code is checked with the /checks skill (README,
# "Adopt in a new project", step 4), then delete these two lines.

# One entry per repo: "name|path|remote|default branch|GitHub owner/repo"
#   path    relative to the project root ("." = the root itself) or absolute
#   remote  the remote that counts as "pushed" (in a fork, YOUR remote, not upstream)
#   default leave empty to read it from <remote>/HEAD
#   GitHub  leave empty to derive it from the remote URL; open PRs + CI are listed from it
# The docs repo is the root ("."), a code repo or a docs-only repo. Docs in one repo: REPOS=("app|.|origin||"), more
# repos added later with `bash .claude/skills/session-start/attach.sh <name> <path>` (a line here and a pointer in the
# repo, so a session opened there finds the docs). Docs in a repo of their own, code repos inside it or elsewhere:
#   REPOS=("api|api|origin|main|" "mobile|mobile|origin|main|" "web|web-main|me|master|owner/web")
REPOS=("project|.|origin||")

# Branches that stay local on purpose (private work, never pushed). Space-separated.
# The script still lists them, marked "local only BY RULE", so nobody "rescues" them with a push.
KEEP_LOCAL=""

# 1 = list the transient systemd user units (systemd-run --user) of this project; 0 = skip.
UNITS=1

# A claimed item's branch with no commit for this many days (counted from the claim when the branch is older) is
# reported as stale: its session may have stopped (notes/item-format.md, Claims).
CLAIM_STALE_DAYS=3

# questions.md and notes/lessons.md longer than this many lines are flagged "⚠ TRIM" (each file has its own size):
# the brief of /session-start then suggests /trim, a session that goes through them with the owner (keep, shorten,
# move to its doc, delete). lessons.md is loaded by every session. 0 = never.
QUESTIONS_TRIM_LINES=1000
LESSONS_TRIM_LINES=1000

# How the code is checked before a merge: by the project's own gate (GATES), by GitHub CI (GITHUB_CI), by both, or
# by nothing yet (both empty: no rule holds). The /checks skill asks the owner and sets these lines.

# The gate of each repo that has one: the command whose exit code says "ready", run in the repo's folder by
# `bash .claude/skills/session-start/gate.sh run <name>`, which keeps a receipt of each commit that passed it.
# One entry per repo, the name as in REPOS: GATES=("api|bin/gate" "web|npm test"). A local CI script the project
# already has is its gate command: run it through gate.sh run, never beside it, so one run gives both records of a
# pass (the script's own, and the receipt the board and the release check read).
GATES=()

# When a gate's exit code is not its verdict (a script that exits 0 once it has run, green or not, or with stages
# skipped), the line it prints when it passed: an extended regular expression, matched without colour codes. The
# gate then passes only when it exits 0 and a line matches. One entry per repo: GATE_PASS=("api|^All checks passed")
GATE_PASS=()

# The repos whose GitHub CI counts, read with gh on the GitHub repo of REPOS: GITHUB_CI=("api" "web").
GITHUB_CI=()

# The rules this project keeps, space-separated, for the gate and for GitHub CI alike:
#   receipt     a release tag (v*) is pushed only when its commit passed: a receipt here for a repo of GATES, CI green
#               on GitHub for a repo of GITHUB_CI. The pre-push hook refuses it otherwise, and while GitHub cannot be
#               read (install it in each of those repos: gate.sh hook <name>)
#   regression  every bug fixed lands with a check that fails without the fix: /handoff names that check
#   merge       a branch is checked alone, then again after it merges: the ground truth reports a default branch whose
#               last commit has no receipt, or whose CI is not green
# In the repo at the project root, a commit that changes only the docs (a handoff, a claim: CLAUDE.md, the trackers,
# notes/, .claude/) keeps the receipt of the commit before it, for both rules: its code is the one that passed.
# Presets: Production = "receipt regression merge" (code others clone, install or deploy), Steady = "regression
# merge" (a project in daily use, released informally), Prototype = "" (fast iteration, nobody depends on it yet).
GATE_RULES=""

# A repo that keeps other rules than the project's: one entry, "<repo>|<its rules>", which replaces GATE_RULES for that
# repo alone (an empty list, "docs|", means it keeps none). A docs repo may keep none, a backend all three:
#   REPO_RULES=("docs|" "web|regression merge")
REPO_RULES=()
