# What ground-truth.sh looks at. Sourced by bash: plain assignments only.
# FILL: set REPOS (and KEEP_LOCAL) for this project, then GATES and the preset of GATE_RULES (README, "Adopt in a
# new project", step 4), then delete these two lines.

# One entry per repo: "name|path|remote|default branch|GitHub owner/repo"
#   path    relative to the project root ("." = the root itself) or absolute
#   remote  the remote that counts as "pushed" (in a fork, YOUR remote, not upstream)
#   default leave empty to read it from <remote>/HEAD
#   GitHub  leave empty to derive it from the remote URL; open PRs + CI are listed from it
# Single repo:     REPOS=("app|.|origin||")
# Multi-repo workspace (the root holds the docs repo, the code repos sit inside it):
#   REPOS=("api|api|origin|main|" "mobile|mobile|origin|main|" "web|web-main|me|master|owner/web")
REPOS=("project|.|origin||")

# Branches that stay local on purpose (private work, never pushed). Space-separated.
# The script still lists them, marked "local only BY RULE", so nobody "rescues" them with a push.
KEEP_LOCAL=""

# 1 = list the transient systemd user units (systemd-run --user) of this project; 0 = skip.
UNITS=1

# A claimed item's branch with no commit for this many days (counted from the claim when the branch is older) is
# reported as stale: its session may have stopped (notes/item-format.md, Claims).
CLAIM_STALE_DAYS=3

# questions.md longer than this many lines is flagged "⚠ TRIM", and /handoff proposes a trim pass of its rulings:
# keep, shorten, move to its doc, delete. Every session reads the file. 0 = never.
QUESTIONS_TRIM_LINES=150

# The gate of each repo that has one: the command whose exit code says "ready", run in the repo's folder by
# `bash .claude/skills/session-start/gate.sh run <name>`, which keeps a receipt of each commit that passed it.
# One entry per repo, the name as in REPOS: GATES=("api|bin/gate" "web|npm test"). A local CI script the project
# already has is its gate command: run it through gate.sh run, never beside it, so one run gives both records of a
# pass (the script's own, and the receipt the board and the release check read).
GATES=()

# The gate rules this project keeps, space-separated; the setup asks the owner for a preset, then for any change:
#   receipt     a release tag (v*) is pushed only when its commit passed the gate: the pre-push hook refuses it
#               otherwise (install it in each repo of GATES: gate.sh hook <name>)
#   regression  every bug fixed lands with a gate check that fails without the fix: /handoff names that check
#   merge       a branch is gated alone, then again after it merges: the ground truth reports a default branch
#               whose last commit has no receipt
# Presets: Production = "receipt regression merge" (code others clone, install or deploy), Steady = "regression
# merge" (a project in daily use, released informally), Prototype = "" (fast iteration, nobody depends on it yet).
GATE_RULES=""
